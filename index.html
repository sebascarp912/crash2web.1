<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash Bandicoot 2 - Web Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 5px; font-size: 1.4rem; color: #38bdf8; }
        p.subtitle { margin-top: 0; margin-bottom: 15px; font-size: 0.9rem; color: #94a3b8; }
        
        .game-wrapper {
            width: 640px;
            max-width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.7);
            border: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        wasmpsx-player {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-box {
            margin-top: 15px;
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-align: center;
        }
    </style>

    <script src="https://js-emulators.github.io/wasmpsx/wasmpsx.js" defer></script>
</head>
<body>

    <h1>Crash Bandicoot 2: Cortex Strikes Back</h1>
    <p class="subtitle">Versión web optimizada para Google Chrome</p>
    
    <div class="game-wrapper">
        <wasmpsx-player id="playstation-game"></wasmpsx-player>
    </div>

    <div class="controls-box">
        <p>🎮 <strong>Teclado:</strong> Flechas (Movimiento) | <strong>Z / X</strong> (Acciones) | <strong>Enter</strong> (Start)</p>
        <p>💡 <em>Haz clic dentro de la pantalla y presiona cualquier botón para jugar.</em></p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const player = document.getElementById('playstation-game');
            if (player && typeof player.loadUrl === 'function') {
                // Pega aquí abajo entre las comillas el enlace directo de descarga de tu archivo en Google Drive:
                player.loadUrl"nwwGoyLBGe070qsrLOXqbTPmHgOFUP7Q"
        });
    </script>

</body>
</html>
